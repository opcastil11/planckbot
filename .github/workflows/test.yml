name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Create venv and install
        run: |
          uv venv .venv
          uv pip install -e ".[dev]"

      - name: Run test suite
        env:
          PYTHONHASHSEED: "0"
        run: |
          .venv/bin/python -m pytest -q

      - name: Smoke-test CLI
        run: |
          .venv/bin/planckbot --version
          .venv/bin/planckbot --help
          .venv/bin/planckbot cron list
          .venv/bin/planckbot synth list
